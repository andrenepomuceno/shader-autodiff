<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exact-gradient SDF raymarcher</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #eef0f3;
      --panel: rgb(255 255 255 / 0.82);
      --text: #1d2228;
      --muted: #5d6670;
      --border: rgb(0 0 0 / 0.12);
      --field: rgb(255 255 255 / 0.9);
      --accent: #2f6fde;
      --error: #c23a2b;
      --error-mark: rgb(230 60 40 / 0.28);
      --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101318;
        --panel: rgb(20 24 30 / 0.8);
        --text: #e3e7ec;
        --muted: #8e98a3;
        --border: rgb(255 255 255 / 0.12);
        --field: rgb(0 0 0 / 0.35);
        --accent: #6ea2ff;
        --error: #ff7b6b;
        --error-mark: rgb(255 100 80 / 0.35);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #panel {
      position: fixed;
      top: 16px;
      left: 16px;
      width: min(480px, calc(100% - 32px));
      max-height: calc(100% - 32px);
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    #panel > summary {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
      user-select: none;
    }
    #panel > summary::marker { content: ''; }
    #panel > summary::before { content: '▸'; color: var(--muted); }
    #panel[open] > summary::before { content: '▾'; }
    #fps { margin-left: auto; font: 12px var(--mono); font-weight: 400; color: var(--muted); }
    .body { padding: 0 14px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
    label { color: var(--muted); font-size: 12px; }
    select, .editor, input[type=range] { width: 100%; }
    select {
      font: inherit;
      color: inherit;
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 6px;
    }
    .editor { position: relative; }
    .editor textarea, .editor .backdrop {
      margin: 0;
      padding: 8px 10px;
      font: 12.5px/1.5 var(--mono);
      white-space: pre;
      overflow-wrap: normal;
      tab-size: 2;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .editor textarea {
      position: relative;
      display: block;
      width: 100%;
      height: 15em;
      resize: vertical;
      color: inherit;
      background: transparent;
      overflow: auto;
      outline: none;
    }
    .editor textarea:focus { border-color: var(--accent); }
    .editor textarea[aria-invalid=true] { border-color: var(--error); }
    .editor .backdrop {
      position: absolute;
      inset: 0;
      overflow: hidden;
      color: transparent;
      background: var(--field);
      pointer-events: none;
    }
    .backdrop mark { color: transparent; background: var(--error-mark); border-bottom: 2px solid var(--error); border-radius: 2px; }
    #error { min-height: 1.4em; margin: -4px 0 0; color: var(--error); font: 12px var(--mono); white-space: pre-wrap; }
    #error:empty::before { content: 'Lines `name = …` define helpers; the last line is f(x, y, z).'; color: var(--muted); font-family: system-ui, sans-serif; }
    .sliders { display: grid; grid-template-columns: auto 1fr 3.2em; gap: 4px 10px; align-items: center; }
    .sliders output { font: 12px var(--mono); text-align: right; color: var(--muted); }
    .toggles { display: flex; flex-wrap: wrap; gap: 6px 16px; }
    .toggles label { color: inherit; font-size: 13px; display: flex; align-items: center; gap: 6px; }
    input[type=range], input[type=checkbox] { accent-color: var(--accent); }
    details.code > summary { cursor: pointer; color: var(--muted); font-size: 12px; }
    details.code pre {
      margin: 6px 0 0;
      max-height: 40vh;
      overflow: auto;
      padding: 8px 10px;
      font: 11.5px/1.45 var(--mono);
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .note { margin: 0; color: var(--muted); font-size: 12px; }
    .note a { color: var(--accent); }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <details id="panel" open>
    <summary>f(x, y, z) <span id="fps"></span></summary>
    <div class="body">
      <select id="preset" aria-label="Preset"></select>
      <div class="editor">
        <div class="backdrop" id="backdrop" aria-hidden="true"></div>
        <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Signed distance function" aria-describedby="error"></textarea>
      </div>
      <p id="error" role="status"></p>
      <div class="sliders">
        <label for="a">a</label><input id="a" type="range" min="0" max="1" step="0.01" value="0.5"><output for="a" id="a-value"></output>
        <label for="b">b</label><input id="b" type="range" min="0" max="1" step="0.01" value="0.5"><output for="b" id="b-value"></output>
      </div>
      <div class="toggles">
        <label><input id="animate" type="checkbox" checked> animate t</label>
        <label><input id="finite" type="checkbox"> finite-difference normals</label>
      </div>
      <details class="code">
        <summary id="code-summary">Generated GLSL</summary>
        <pre><code id="code"></code></pre>
      </details>
      <p class="note">Normals come from the exact gradient computed alongside f by
        <a href="../../README.md">shader-autodiff</a>; drag to orbit, scroll to zoom.</p>
    </div>
  </details>
  <script type="module" src="./main.js"></script>
</body>
</html>
